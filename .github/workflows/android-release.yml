name: Android release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified APK and incremental signature
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      tag: ${{ steps.build.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - name: Test and prepare Android tools
        run: |
          go test ./...
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - name: Build, sign and verify
        id: build
        env:
          ANDROID_SIGNING: ${{ secrets.LEXIGO_ANDROID_SIGNING }}
          WORDREVIEW_KEY_ALIAS: lexigo
        run: |
          set -euo pipefail
          umask 077
          signing="$(mktemp -d "$RUNNER_TEMP/lexigo-signing.XXXXXXXX")"
          trap 'rm -rf -- "$signing"' EXIT
          python3 - "$signing" <<'PY'
          import base64
          import json
          import os
          import sys
          from pathlib import Path

          directory = Path(sys.argv[1])
          payload = json.loads(os.environ["ANDROID_SIGNING"])
          for field in ("private_key", "certificate"):
              (directory / (field + ".der")).write_bytes(base64.b64decode(payload[field], validate=True))
          PY
          unset ANDROID_SIGNING
          export WORDREVIEW_KEYSTORE="$signing/lexigo.p12"
          export WORDREVIEW_KEY_PASSWORD="$(openssl rand -hex 32)"
          openssl pkey -inform DER -in "$signing/private_key.der" -out "$signing/key.pem"
          openssl x509 -inform DER -in "$signing/certificate.der" -out "$signing/cert.pem"
          openssl pkcs12 -export -inkey "$signing/key.pem" -in "$signing/cert.pem" \
            -name "$WORDREVIEW_KEY_ALIAS" -passout env:WORDREVIEW_KEY_PASSWORD -out "$WORDREVIEW_KEYSTORE"
          rm -- "$signing/private_key.der" "$signing/key.pem"

          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          read -r package version_code version < <(python3 - <<'PY'
          from xml.etree.ElementTree import parse
          manifest = parse("android/src/main/AndroidManifest.xml").getroot()
          namespace = "{http://schemas.android.com/apk/res/android}"
          print(manifest.attrib["package"], manifest.attrib[namespace + "versionCode"], manifest.attrib[namespace + "versionName"])
          PY
          )
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          apk="LexiGo-Android-$version.apk"
          bash android/build-android.sh --release "dist/$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "dist/$apk" > "$signing/badging.txt"
          grep -F "package: name='$package' versionCode='$version_code' versionName='$version'" "$signing/badging.txt"
          grep -E "^native-code: ('arm64-v8a' 'x86_64'|'x86_64' 'arm64-v8a')[[:space:]]*$" "$signing/badging.txt"
          (cd dist && sha256sum "$apk" "$apk.idsig" > SHA256SUMS)
          printf 'tag=v%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: verified-android-release
          path: |
            dist/*.apk
            dist/*.idsig
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.build.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: verified-android-release
          path: dist
      - name: Publish the verified files
        run: |
          set -euo pipefail
          apk="LexiGo-Android-${TAG#v}.apk"
          (cd dist && sha256sum --check SHA256SUMS)
          notes=(--generate-notes)
          if [[ -f "android/releases/$TAG.md" ]]; then
            notes=(--notes-file "android/releases/$TAG.md")
          fi
          if gh release view "$TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/lexigo-draft"; then
            [[ "$(cat "$RUNNER_TEMP/lexigo-draft")" == true ]]
            gh release upload "$TAG" "dist/$apk" "dist/$apk.idsig" --clobber
          else
            gh release create "$TAG" "dist/$apk" "dist/$apk.idsig" --draft \
              --target "$GITHUB_SHA" --title "LexiGo ${TAG#v}" "${notes[@]}"
          fi
          remote="$(mktemp -d)"
          gh release download "$TAG" --dir "$remote" --pattern "$apk" --pattern "$apk.idsig"
          (cd "$remote" && sha256sum --check "$GITHUB_WORKSPACE/dist/SHA256SUMS")
          gh release edit "$TAG" --draft=false --latest
