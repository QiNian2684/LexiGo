name: Repair Android release asset

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Unified release tag, for example v3.5.5
        required: true
        type: string
      source_run:
        description: LexiGo release run with a verified Android artifact
        required: true
        type: string
      revision:
        description: New download suffix number, for example 1 for -r1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lexigo-release
  cancel-in-progress: false

jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_RUN: ${{ inputs.source_run }}
      ASSET_REVISION: ${{ inputs.revision }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Replace the Android APK using the original verified artifact
        run: bash scripts/repair-android-release.sh "$RELEASE_TAG" "$SOURCE_RUN" "$ASSET_REVISION"
