name: Windows build

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested Windows Setup and portable EXE (same signing status as 3.3.1)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - name: Build the Windows executable and Setup
        run: |
          set -euo pipefail
          nsis="$(mktemp -d)"
          source=https://deb.debian.org/debian/pool/main/n/nsis
          cd "$nsis"
          curl -fsSL --retry 3 "$source/nsis_3.11-1_amd64.deb" -o nsis.deb
          curl -fsSL --retry 3 "$source/nsis-common_3.11-1_all.deb" -o nsis-common.deb
          sha256sum --check <<'CHECKSUMS'
          e6eb6ffb70f0df09e95dedb2d2cf55ad3c2679f7c2ae357d0c00cc4c83178690  nsis.deb
          103a3284c1a5356efa0aba90fdfc391c3cde8e7df8726377cef0f98471584047  nsis-common.deb
          CHECKSUMS
          dpkg-deb -x nsis-common.deb "$nsis"
          dpkg-deb -x nsis.deb "$nsis"
          cd "$GITHUB_WORKSPACE"
          version="$(sed -n 's/^!define VERSION "\([0-9.]*\)"$/\1/p' installer/LexiGo.nsi)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -buildvcs=false -trimpath \
            -ldflags='-s -w -H=windowsgui' -o dist/LexiGo.exe .
          cd installer
          NSISDIR="$nsis/usr/share/nsis" "$nsis/usr/bin/makensis" \
            "-DPACKAGE_EXE=$GITHUB_WORKSPACE/dist/LexiGo.exe" \
            "-DPACKAGE_SETUP=$GITHUB_WORKSPACE/dist/LexiGo-Setup-$version.exe" LexiGo.nsi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: windows-packaged
          path: dist/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  verify:
    needs: package
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: windows-packaged
          path: dist
      - name: Run Windows tests and install Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test -buildvcs=false ./...
          if ($LASTEXITCODE -ne 0) { throw 'Windows Go tests failed.' }
          python scripts/test_http.py dist/LexiGo.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows HTTP tests failed.' }
          python scripts/test_portable.py dist/LexiGo.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows portable tests failed.' }
          $setup = Get-Item 'dist\LexiGo-Setup-*.exe'
          $installDir = Join-Path $env:RUNNER_TEMP 'lexigo-test-install'
          $installer = Start-Process -FilePath $setup.FullName -ArgumentList '/S', "/D=$installDir" -PassThru -Wait
          if ($installer.ExitCode -ne 0) { throw "Installer returned $($installer.ExitCode)." }
          $installed = Join-Path $installDir 'LexiGo.exe'
          if ((Get-FileHash -LiteralPath $installed).Hash -ne (Get-FileHash -LiteralPath 'dist\LexiGo.exe').Hash) {
              throw 'Installed executable differs from the Windows build.'
          }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: windows-build-for-signing
          path: dist/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: verify
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: windows-build-for-signing
          path: dist
      - name: Publish the Windows-only release
        run: |
          set -euo pipefail
          installers=(dist/LexiGo-Setup-*.exe)
          [[ ${#installers[@]} == 1 && -f "${installers[0]}" ]]
          setup="${installers[0]##*/}"
          [[ "$setup" =~ ^LexiGo-Setup-([0-9]+\.[0-9]+\.[0-9]+)\.exe$ ]]
          version="${BASH_REMATCH[1]}"
          tag="v$version-windows"
          notes='Windows x64 安装版和便携版。已在 Windows 验证安装和运行。修复切页收尾旧画面闪回，精简侧栏滚动条，新增「首次记住即掌握」学习选项，默认关闭。与 3.3.1 的 Windows 安装包相同，此版本的 EXE 未做 Authenticode 签名。'
          gh release create "$tag" "dist/$setup" dist/LexiGo.exe --draft --latest=false \
            --target "$GITHUB_SHA" --title "LexiGo $version Windows" --notes "$notes"
          remote="$(mktemp -d)"
          (cd dist && sha256sum "$setup" LexiGo.exe) > "$remote/checksums"
          gh release download "$tag" --dir "$remote" --pattern "$setup" --pattern LexiGo.exe
          (cd "$remote" && sha256sum --check checksums)
          gh release edit "$tag" --draft=false --latest=false
